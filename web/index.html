<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b3d91" />
  <title>Voli</title>
  <link rel="icon" href="img/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="vendor/maplibre-gl.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="map"></div>

  <!-- Top: search -->
  <header id="topbar">
    <div class="search">
      <img class="logo" src="img/icon.svg" alt="" aria-hidden="true" />
      <input id="search-input" type="search" placeholder="Para onde?" autocomplete="off" enterkeyhint="search" />
      <button id="search-clear" class="icon-btn hidden" aria-label="Limpar">✕</button>
    </div>
    <div id="search-results" class="card hidden"></div>
    <div id="age-banner" class="hidden"></div>
  </header>

  <!-- Navigation instruction card -->
  <div id="nav-card" class="hidden">
    <div class="nav-arrow" id="nav-arrow">↑</div>
    <div class="nav-text">
      <div class="nav-dist" id="nav-dist"></div>
      <div class="nav-instr" id="nav-instr"></div>
    </div>
  </div>
  <div id="nav-safety" class="hidden">Siga sempre as placas e a sinalização. Elas valem mais que o app.</div>

  <!-- Floating buttons -->
  <div id="fabs">
    <button class="fab hidden" id="btn-compass" aria-label="Voltar o norte para cima"><span id="compass-needle">➤</span></button>
    <button class="fab" id="btn-3d" aria-label="Alternar 3D">3D</button>
  </div>
  <button class="fab big" id="btn-locate" aria-label="Minha localização">◎</button>

  <!-- Bottom sheet -->
  <section id="sheet" class="hidden" aria-live="polite">
    <div class="sheet-handle"></div>
    <div id="sheet-content"></div>
  </section>

  <!-- Bottom navigation -->
  <nav id="bottombar">
    <button data-panel="packs"><span>⬇</span>Mapas</button>
    <button data-panel="points"><span>⚑</span>Pontos</button>
    <button data-panel="survival" class="accent"><span>✚</span>Sobreviver</button>
    <button data-panel="settings"><span>⚙</span>Ajustes</button>
  </nav>

  <!-- Navigation footer -->
  <footer id="nav-footer" class="hidden">
    <div><b id="nav-eta"></b><small id="nav-remaining"></small></div>
    <button id="nav-overview" class="btn ghost" data-icon="⤢" aria-label="Ver a rota inteira">Rota</button>
    <button id="nav-stop" class="btn danger" data-icon="■" aria-label="Encerrar navegação">Sair</button>
  </footer>

  <!-- SOS fullscreen -->
  <div id="sos" class="hidden"></div>

  <!-- Modal -->
  <div id="modal" class="hidden"><div class="modal-box" id="modal-box"></div></div>

  <div id="toast" class="hidden"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
