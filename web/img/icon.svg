<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <!-- Voli: compass drawn in pen and ink with watercolour washes -->
  <defs>
    <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.45" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0.55"/>
    </filter>
    <filter id="wash" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="3" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="2"/>
      <feColorMatrix values="0 0 0 0 .45 0 0 0 0 .38 0 0 0 0 .28 0 0 0 .22 0"/>
    </filter>
    <pattern id="hatch" width="1.7" height="1.7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="1.7" stroke="#14254a" stroke-width=".5"/>
    </pattern>
    <pattern id="hatchLight" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <line x1="0" y1="0" x2="0" y2="2.4" stroke="#14254a" stroke-width=".35"/>
    </pattern>
    <linearGradient id="ringwash" gradientUnits="userSpaceOnUse" x1="24" y1="28" x2="86" y2="82">
      <stop offset="0" stop-color="#4f9cf0"/><stop offset=".45" stop-color="#6aa8f2"/><stop offset=".58" stop-color="#ffb36a"/><stop offset="1" stop-color="#ff8a1a"/>
    </linearGradient>
    <clipPath id="tile"><rect width="108" height="108" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="108" height="108" fill="#f5ecda"/>
    <rect width="108" height="108" filter="url(#paper)"/>
    <!-- watercolour ring -->
    <circle cx="54" cy="54" r="33.4" fill="none" stroke="url(#ringwash)" stroke-width="5.4" opacity=".8" filter="url(#wash)"/>
    <!-- ink rings and degree ticks -->
    <g fill="none" stroke="#14254a" stroke-linecap="round" filter="url(#ink)">
      <circle cx="54" cy="54" r="36.2" stroke-width="1.5"/>
      <circle cx="54" cy="54" r="30.8" stroke-width=".9"/>
      <path d="M56.72,22.92 L56.82,21.72 M59.42,23.27 L59.80,21.11 M62.08,23.86 L62.39,22.70 M64.67,24.68 L65.42,22.61 M67.19,25.72 L67.69,24.64 M69.60,26.98 L70.70,25.07 M71.90,28.44 L72.58,27.46 M74.05,30.10 L75.47,28.41 M76.06,31.94 L79.17,28.83 M77.90,33.95 L79.59,32.53 M79.56,36.10 L80.54,35.42 M81.02,38.40 L82.93,37.30 M82.28,40.81 L83.36,40.31 M83.32,43.33 L85.39,42.58 M84.14,45.92 L85.30,45.61 M84.73,48.58 L86.89,48.20 M85.08,51.28 L86.28,51.18 M85.08,56.72 L86.28,56.82 M84.73,59.42 L86.89,59.80 M84.14,62.08 L85.30,62.39 M83.32,64.67 L85.39,65.42 M82.28,67.19 L83.36,67.69 M81.02,69.60 L82.93,70.70 M79.56,71.90 L80.54,72.58 M77.90,74.05 L79.59,75.47 M76.06,76.06 L79.17,79.17 M74.05,77.90 L75.47,79.59 M71.90,79.56 L72.58,80.54 M69.60,81.02 L70.70,82.93 M67.19,82.28 L67.69,83.36 M64.67,83.32 L65.42,85.39 M62.08,84.14 L62.39,85.30 M59.42,84.73 L59.80,86.89 M56.72,85.08 L56.82,86.28 M51.28,85.08 L51.18,86.28 M48.58,84.73 L48.20,86.89 M45.92,84.14 L45.61,85.30 M43.33,83.32 L42.58,85.39 M40.81,82.28 L40.31,83.36 M38.40,81.02 L37.30,82.93 M36.10,79.56 L35.42,80.54 M33.95,77.90 L32.53,79.59 M31.94,76.06 L28.83,79.17 M30.10,74.05 L28.41,75.47 M28.44,71.90 L27.46,72.58 M26.98,69.60 L25.07,70.70 M25.72,67.19 L24.64,67.69 M24.68,64.67 L22.61,65.42 M23.86,62.08 L22.70,62.39 M23.27,59.42 L21.11,59.80 M22.92,56.72 L21.72,56.82 M22.92,51.28 L21.72,51.18 M23.27,48.58 L21.11,48.20 M23.86,45.92 L22.70,45.61 M24.68,43.33 L22.61,42.58 M25.72,40.81 L24.64,40.31 M26.98,38.40 L25.07,37.30 M28.44,36.10 L27.46,35.42 M30.10,33.95 L28.41,32.53 M31.94,31.94 L28.83,28.83 M33.95,30.10 L32.53,28.41 M36.10,28.44 L35.42,27.46 M38.40,26.98 L37.30,25.07 M40.81,25.72 L40.31,24.64 M43.33,24.68 L42.58,22.61 M45.92,23.86 L45.61,22.70 M48.58,23.27 L48.20,21.11 M51.28,22.92 L51.18,21.72" stroke-width=".55"/>
    </g>
    <!-- needle -->
    <path d="M29,56.6 L72.4,34.4 L50.7,57.9 Z" fill="#fffaf0"/>
    <path d="M29,56.6 L72.4,34.4 L50.7,57.9 Z" fill="url(#hatchLight)" opacity=".7"/>
    <path d="M72.4,34.4 L50.7,57.9 L56.1,76 Z" fill="#ff7a00" filter="url(#wash)"/>
    <path d="M29,56.6 L72.4,34.4 L56.1,76 L50.7,57.9 Z M72.4,34.4 L50.7,57.9" fill="none" stroke="#14254a" stroke-width="1.4" stroke-linejoin="round" filter="url(#ink)"/>
    <circle cx="51.6" cy="56.2" r="2.2" fill="#f5ecda" stroke="#14254a" stroke-width="1" filter="url(#ink)"/>
  </g>
  <rect x=".7" y=".7" width="106.6" height="106.6" rx="23.3" fill="none" stroke="#14254a" stroke-width="1.4" filter="url(#ink)"/>
</svg>
