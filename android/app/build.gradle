plugins {
    id "com.android.application"
}

// Where the app downloads state map packs from. GitHub Actions sets GITHUB_REPOSITORY automatically,
// so the APK built there points at that repository's "maps" release.
def repo = System.getenv("GITHUB_REPOSITORY") ?: (project.findProperty("voli.repo") ?: "OWNER/voli")
def packsBaseUrl = project.findProperty("voli.packsBaseUrl") ?: "https://github.com/${repo}/releases/download/maps/"

android {
    namespace "app.voli"
    compileSdk 35

    defaultConfig {
        applicationId "app.voli"
        minSdk 26
        targetSdk 35
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1") as int)
        versionName "0.1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
        buildConfigField "String", "PACKS_BASE_URL", "\"${packsBaseUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            // The whole web app (HTML/JS/CSS, MapLibre, fonts) is bundled as assets.
            assets.srcDirs = ["../../web"]
        }
    }

    signingConfigs {
        release {
            // Provide these as GitHub secrets / environment variables to produce a signed release APK.
            def ks = System.getenv("VOLI_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("VOLI_KEYSTORE_PASSWORD")
                keyAlias System.getenv("VOLI_KEY_ALIAS")
                keyPassword System.getenv("VOLI_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("VOLI_KEYSTORE")) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ["pbf", "mjs"]
    }
}

// No third-party dependencies: only the Android SDK.
