# Builds the Android APK and publishes it to the "app" GitHub release.
name: Build apps (Android + Linux)

on:
  push:
    branches: [main]
    paths: ["android/**", "web/**", "desktop/**", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Optional release signing key
        env:
          KEYSTORE_B64: ${{ secrets.VOLI_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/voli.jks"
            echo "VOLI_KEYSTORE=$RUNNER_TEMP/voli.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          VOLI_KEYSTORE_PASSWORD: ${{ secrets.VOLI_KEYSTORE_PASSWORD }}
          VOLI_KEY_ALIAS: ${{ secrets.VOLI_KEY_ALIAS }}
          VOLI_KEY_PASSWORD: ${{ secrets.VOLI_KEY_PASSWORD }}
        run: |
          cd android
          if [ -n "${VOLI_KEYSTORE:-}" ]; then
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../voli.apk
          else
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../voli.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: voli-apk
          path: voli.apk

      - name: Publish to the "app" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app >/dev/null 2>&1 || gh release create app --title "Voli for Android" \
            --notes "Latest Android build. Install voli.apk on your phone (allow installs from this source)."
          gh release upload app --clobber voli.apk

  linux:
    # Linux / Raspberry Pi package (same web app, served locally by desktop/voli.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build voli-linux.tar.gz
        run: |
          mkdir -p dist/voli-linux
          cp -r web desktop/voli.py desktop/desktop-bridge.js desktop/voli.png desktop/install.sh desktop/uninstall.sh desktop/README.txt dist/voli-linux/
          printf '{"packsBaseUrl": "https://github.com/%s/releases/download/maps/"}\n' "$GITHUB_REPOSITORY" > dist/voli-linux/config.json
          tar -C dist -czf voli-linux.tar.gz voli-linux
      - uses: actions/upload-artifact@v4
        with:
          name: voli-linux
          path: voli-linux.tar.gz
      - name: Publish to the "app" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app >/dev/null 2>&1 || gh release create app --title "Voli" \
            --notes "Latest builds. Android: install voli.apk. Linux / Raspberry Pi: download voli-linux.tar.gz, extract it and run ./install.sh"
          gh release upload app --clobber voli-linux.tar.gz
